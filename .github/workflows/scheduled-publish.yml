name: Scheduled Blog Publish

# This workflow triggers Netlify builds on a schedule to publish scheduled blog posts
# Blog posts with a future date will be published when the scheduled build runs after that date

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build Hook
        run: |
          echo "Triggering Netlify build for scheduled blog posts..."

          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "Error: NETLIFY_BUILD_HOOK secret is not configured"
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Build triggered successfully! (HTTP $http_code)"
          else
            echo "Error: Build hook failed with HTTP $http_code"
            echo "Response: $body"
            exit 1
          fi
